experiment:
  id: wavlm-base-plus-frozen-v1
  seed: 20261007

paths:
  train_manifest: ${AUDIO_DATA_ROOT}/asvspoof2019/manifests/development/train.csv
  dev_manifest: ${AUDIO_DATA_ROOT}/asvspoof2019/manifests/development/dev.csv
  feature_cache: ${AUDIO_CACHE_ROOT}/features/wavlm-base-plus-frozen-v1
  checkpoint_dir: ${AUDIO_MODEL_ROOT}/audio-deepfake/wavlm-base-plus-frozen-v1
  output_dir: ${AUDIO_OUTPUT_ROOT}/experiments/wavlm-base-plus-frozen-v1

model:
  name: microsoft/wavlm-base-plus
  revision: 4c66d4806a428f2e922ccfa1a962776e232d487b
  hidden_size: 768
  pooling: masked_mean_last_hidden_state
  encoder_frozen: true
  dropout: 0.1

preprocessing:
  sample_rate: 16000
  max_duration_seconds: 4.0
  crop_strategy: center
  mono: true

feature_extraction:
  batch_size: 32
  num_workers: 8
  precision: bfloat16

training:
  positive_label: spoof
  imbalance_strategy: class_weighted_bce
  batch_size: 512
  gradient_accumulation: 1
  epochs: 30
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: none
  early_stopping_patience: 5
  mixed_precision: bfloat16
  checkpoint_selection: lowest_dev_eer_then_highest_pr_auc_then_earliest_epoch
  threshold_selection: maximum_dev_balanced_accuracy_closest_to_0.5_on_ties

stages:
  smoke_train_samples: 8
  smoke_dev_samples: 8
  subset_train_samples: 1024
  subset_dev_samples: 512
  subset_epochs: 3
